name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  workflow-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install matching test dependencies
        run: python -m pip install "numpy>=1.26,<3" "opencv-contrib-python>=4.10,<5"
      - name: Verify lifecycle
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Verify command entry
        env:
          PYTHONPATH: src
        run: python -m gesture_aid.cli demo --intent request_water --confirm --delivered
      - name: Verify WLASL metadata and mapping
        env:
          PYTHONPATH: src
        run: |
          python -m gesture_aid.cli wlasl stats --gloss water tissue
          python -m gesture_aid.cli demo --gloss water --confirm --delivered
