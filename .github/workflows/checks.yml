name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  workflow-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify lifecycle
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Verify command entry
        env:
          PYTHONPATH: src
        run: python -m gesture_aid.cli demo --intent request_water --confirm --delivered
